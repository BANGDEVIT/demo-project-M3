services:
  db:
    image: pgvector/pgvector:pg17
    container_name: m3-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong file .env}
      POSTGRES_DB: ${POSTGRES_DB:-m3}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - m3pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-m3}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  m3pgdata:
    name: m3pgdata
